name: Build NILKON for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install VLC and Inno Setup
        shell: pwsh
        run: |
          choco install vlc innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll")) { throw "VLC was not installed" }

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app and installer
        run: python build_release.py

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\NILKON -DestinationPath NILKON_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NILKON-Windows
          path: |
            installer_output/*.exe
            NILKON_portable.zip
          if-no-files-found: error
